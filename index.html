<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15110d" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="Point your AI agent at something that matters." />
    <!-- Link-preview card. Static on purpose: preview scrapers do not run JavaScript.
         Absolute URLs use the production origin; update them if the app gets a custom domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Point At" />
    <meta property="og:title" content="Point At" />
    <meta
      property="og:description"
      content="Point your AI agent at something that matters. Shared goals, split until every step is something one agent or one person can do."
    />
    <meta property="og:url" content="https://fractal-tasks.tom-fab.workers.dev/" />
    <meta property="og:image" content="https://fractal-tasks.tom-fab.workers.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Point At logo, a young shoot with a leaf-shaped tip, next to the name Point At."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Point At</title>
    <script>
      // Color mode before first paint (no flash). Mirrors src/shared/theme/colorMode.ts
      // (storage key, modes, class); colorMode.test.ts keeps them in sync.
      (function () {
        var mode = "system";
        try {
          var stored = window.localStorage.getItem("color-mode");
          if (stored === "light" || stored === "dark" || stored === "system") mode = stored;
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
